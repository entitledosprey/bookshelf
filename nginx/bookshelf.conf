# Append this to /home/ubuntu/calorie-app/nginx/nginx.conf, which the edge
# nginx:alpine container (calorie-app-nginx-1) mounts as conf.d/default.conf.
# That is a single mounted file, not a directory, so proxy headers are inlined
# here rather than pulled from a shared snippet.
#
# Covers are proxied from the app's local cache, never hotlinked from Goodreads
# or Amazon, so img-src can stay at 'self'.

limit_req_zone $binary_remote_addr zone=bookshelf_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=bookshelf_sync:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name bookshelf.entitledosprey.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bookshelf.entitledosprey.com;

    ssl_certificate     /etc/letsencrypt/live/bookshelf.entitledosprey.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookshelf.entitledosprey.com/privkey.pem;

    # Cloudflare in front: recover the real client IP for rate limiting.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Framed photographs for shelves arrive as base64 data URLs.
    client_max_body_size 8m;

    location /api/v1/auth/ {
        limit_req zone=bookshelf_auth burst=5 nodelay;
        proxy_pass http://bookshelf:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /api/v1/sync/ {
        limit_req zone=bookshelf_sync burst=3 nodelay;
        proxy_pass http://bookshelf:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://bookshelf:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
